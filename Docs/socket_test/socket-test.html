<!DOCTYPE html>
<html>
<head>
    <title>Test Socket.io</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js" integrity="sha384-Gr6Lu2Ajx28mzwyVR8CFkULdCU7kMlZ9UthllibdOSo6qAiN+yXNHqtgdTvFXMT4" crossorigin="anonymous"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a1a; color: white; }
        .container { display: flex; gap: 20px; }
        .player { flex: 1; padding: 20px; background: #2a2a2a; border-radius: 10px; }
        button { margin: 5px; padding: 10px; background: #4a4a4a; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #6a6a6a; }
        .log { margin-top: 20px; padding: 10px; background: #333; height: 200px; overflow-y: scroll; font-family: monospace; }
    </style>
</head>
<body>
    <h2>🎮 Test Socket.io - Quantum Bluff</h2>
    <div class="container">
        <div class="player" id="player1">
            <h3>Host (ad365f65...)</h3>
            <div>
                <button onclick="sendAction('player1', 'CHECK')">CHECK</button>
                <button onclick="sendAction('player1', 'CALL')">CALL</button>
                <button onclick="sendAction('player1', 'FOLD')">FOLD</button>
                <input type="number" id="raise1" placeholder="Montant" />
                <button onclick="sendRaise('player1')">RAISE</button>
            </div>
            <div class="log" id="log1"></div>
        </div>
        <div class="player" id="player2">
            <h3>Player1 (6c5b169b...)</h3>
            <div>
                <button onclick="sendAction('player2', 'CHECK')">CHECK</button>
                <button onclick="sendAction('player2', 'CALL')">CALL</button>
                <button onclick="sendAction('player2', 'FOLD')">FOLD</button>
                <input type="number" id="raise2" placeholder="Montant" />
                <button onclick="sendRaise('player2')">RAISE</button>
            </div>
            <div class="log" id="log2"></div>
        </div>
    </div>

    <script>
        const GAME_ID = 'game_1773342476029'; // Remplace par ton gameId
        const HOST_ID = 'ad365f65-8b98-41ed-9a71-c607856bbd2d';
        const PLAYER1_ID = '6c5b169b-e0fc-4ec1-874c-3ee1a4ddf86b';
        const TOKEN = ''; // Remplace par ton JWT (login app puis localStorage.getItem('token'))

        // Connexions Socket
        const socketHost = io('http://localhost:3000', {
            extraHeaders: { Authorization: `Bearer ${TOKEN}` }
        });
        const socketPlayer = io('http://localhost:3000', {
            extraHeaders: { Authorization: `Bearer ${TOKEN}` }
        });

        function log(elementId, msg) {
            const logDiv = document.getElementById(elementId);
            logDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Configuration Host
        socketHost.on('connect', () => {
            log('log1', '✅ Host connecté');
            socketHost.emit('JOIN_GAME', { gameId: GAME_ID, playerId: HOST_ID });
        });
        socketHost.on('GAME_UPDATE', (data) => {
            log('log1', '📊 Mise à jour reçue');
            console.log('Host update:', data);
        });
        socketHost.on('TURN_TIMER', (data) => {
            log('log1', `⏱️ Timer: ${data.timeLeft}s`);
        });

        // Configuration Player1
        socketPlayer.on('connect', () => {
            log('log2', '✅ Player1 connecté');
            socketPlayer.emit('JOIN_GAME', { gameId: GAME_ID, playerId: PLAYER1_ID });
        });
        socketPlayer.on('GAME_UPDATE', (data) => {
            log('log2', '📊 Mise à jour reçue');
            console.log('Player update:', data);
        });
        socketPlayer.on('TURN_TIMER', (data) => {
            log('log2', `⏱️ Timer: ${data.timeLeft}s`);
        });

        // Fonctions d'action
        function sendAction(player, action) {
            const playerId = player === 'player1' ? HOST_ID : PLAYER1_ID;
            fetch(`http://localhost:3000/api/game/${GAME_ID}/action`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`
                },
                body: JSON.stringify({ playerId, action })
            })
            .then(res => res.json())
            .then(data => log(player === 'player1' ? 'log1' : 'log2', `👉 Action ${action} envoyée`))
            .catch(err => log(player === 'player1' ? 'log1' : 'log2', `❌ Erreur: ${err.message}`));
        }

        function sendRaise(player) {
            const playerId = player === 'player1' ? HOST_ID : PLAYER1_ID;
            const amount = document.getElementById(player === 'player1' ? 'raise1' : 'raise2').value;
            fetch(`http://localhost:3000/api/game/${GAME_ID}/action`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`
                },
                body: JSON.stringify({ playerId, action: 'RAISE', amount: parseInt(amount) })
            })
            .then(res => res.json())
            .then(data => log(player === 'player1' ? 'log1' : 'log2', `💰 Raise ${amount} envoyé`))
            .catch(err => log(player === 'player1' ? 'log1' : 'log2', `❌ Erreur: ${err.message}`));
        }
    </script>
</body>
</html>
