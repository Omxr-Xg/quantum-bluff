# ============================================
# .gitlab-ci.yml - Quantum Bluff
# Configuration CI/CD professionnelle
# ============================================

# Définition des stages (étapes du pipeline)
stages:
  - lint           # Vérification du style de code
  - test           # Tests unitaires
  - test-security  # Tests de sécurité
  - build          # Compilation
  - analyze        # Analyse de code
  - deploy-staging # Déploiement sur staging
  - deploy-prod    # Déploiement sur production (manuel)

# Variables globales
variables:
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NODE_OPTIONS: "--max-old-space-size=4096"

# Cache pour accélérer les pipelines
cache:
  paths:
    - .m2/repository/
    - node_modules/
    - frontend/node_modules/
    - backend/target/

# ============================================
# BACKEND - JAVA/MAVEN
# ============================================

backend:lint:
  stage: lint
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - echo "🔍 Vérification du style de code backend..."
    - mvn checkstyle:check
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/
  artifacts:
    reports:
      codequality: backend/target/checkstyle-result.xml
    expire_in: 1 week

backend:test:
  stage: test
  image: maven:3.8-openjdk-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quantum_test
  script:
    - cd backend
    - echo "🧪 Lancement des tests backend..."
    - mvn test
    - mvn jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/target/site/jacoco/jacoco.xml
    paths:
      - backend/target/site/jacoco/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:build:
  stage: build
  image: maven:3.8-openjdk-17
  script:
    - cd backend
    - echo "📦 Build backend..."
    - mvn package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# FRONTEND - REACT/NODE
# ============================================

frontend:lint:
  stage: lint
  image: node:18
  script:
    - cd frontend
    - echo "🔍 Vérification du style frontend..."
    - npm install
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

frontend:test:
  stage: test
  image: node:18
  script:
    - cd frontend
    - echo "🧪 Lancement des tests frontend..."
    - npm install
    - npm test -- --coverage --watchAll=false
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

frontend:build:
  stage: build
  image: node:18
  script:
    - cd frontend
    - echo "📦 Build frontend..."
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# SÉCURITÉ - LINDA & MASSI
# ============================================

security:scan-deps:
  stage: test-security
  image: node:18
  script:
    - echo "🔐 Scan des dépendances frontend..."
    - cd frontend
    - npm audit --production || true
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/
  artifacts:
    reports:
      dependency_scanning: frontend/npm-audit.json
    expire_in: 1 week

security:scan-docker:
  stage: test-security
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "🔐 Scan des images Docker..."
    - docker build -t quantum-bluff:latest .
    - docker scan quantum-bluff:latest || true
  allow_failure: true
  only:
    - main
    - /^release\/.*$/
  dependencies: []

security:trivy-scan:
  stage: test-security
  image: aquasec/trivy:latest
  script:
    - echo "🔐 Scan Trivy complet..."
    - trivy fs --severity HIGH,CRITICAL --no-progress --exit-code 0 .
  allow_failure: true
  only:
    - main
    - develop

# ============================================
# ANALYSE DE CODE - QUALITÉ
# ============================================

analyze:sonarqube:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - echo "📊 Analyse SonarQube..."
    - sonar-scanner
      -Dsonar.projectKey=quantum-bluff
      -Dsonar.sources=.
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**
  only:
    - main
    - develop
  dependencies:
    - backend:test
    - frontend:test

# ============================================
# DÉPLOIEMENTS
# ============================================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur l'environnement STAGING..."
    - apk add --no-cache curl
    - curl -X POST $STAGING_DEPLOY_HOOK
  environment:
    name: staging
    url: https://staging.quantum-bluff.fr
  only:
    - develop
  dependencies:
    - backend:build
    - frontend:build

deploy:production:
  stage: deploy-prod
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur PRODUCTION..."
    - apk add --no-cache curl
    - curl -X POST $PRODUCTION_DEPLOY_HOOK
  environment:
    name: production
    url: https://quantum-bluff.fr
  only:
    - main
  when: manual  # Déploiement manuel uniquement
  dependencies:
    - backend:build
    - frontend:build

# ============================================
# RAPPORTS DE COUVERTURE
# ============================================

coverage:
  stage: test
  image: alpine:latest
  script:
    - echo "✅ Tests et couverture terminés"
  dependencies: []
  only:
    - main
    - develop