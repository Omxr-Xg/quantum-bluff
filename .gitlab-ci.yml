# ============================================
# .gitlab-ci.yml - Quantum Bluff (FIXED)
# ============================================

variables:
  NODE_IMAGE: public.ecr.aws/docker/library/node:20
  POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.58.1

# FIX SHELL (important)
.node_docker_ci:
  image:
    name: public.ecr.aws/docker/library/node:20
    entrypoint: [""]

default:
  tags:
    - node18

stages:
  - lint
  - test
  - test-security
  - build
  - docker-build
  - deploy

cache:
  key:
    files:
      - server/package-lock.json
      - client/package-lock.json
  paths:
    - .npm/

# ============================================
# BACKEND
# ============================================

backend:lint:
  extends: .node_docker_ci
  stage: lint
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:test:
  extends: .node_docker_ci
  stage: test
  tags: [kubernetes]
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    NODE_ENV: test
    JWT_SECRET: "ci-secret-32chars-minimum-123456"
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - npm ci
    - npm run test:coverage
  only:
    - develop
    - main

backend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd server
    - npm ci
    - npx prisma generate
    - npm run build
  only:
    - main
    - /^release\/.*$/

# ============================================
# FRONTEND
# ============================================

frontend:lint:
  extends: .node_docker_ci
  stage: lint
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - develop
    - main

frontend:test:
  extends: .node_docker_ci
  stage: test
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm test
  only:
    - develop
    - main

frontend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run build
  only:
    - main
    - /^release\/.*$/

# ============================================
# DATABASE
# ============================================

database:test:
  stage: test
  tags: [kubernetes]
  image:
    name: public.ecr.aws/docker/library/postgres:15
    entrypoint: [""]
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - psql -h postgres -U test_user -d quantum_test -c "SELECT 1;"
  only:
    - develop
    - main

# ============================================
# SECURITY
# ============================================

security:npm:
  extends: .node_docker_ci
  stage: test-security
  script:
    - cd server && npm ci && npm audit --omit=dev || true
    - cd ../client && npm ci --legacy-peer-deps && npm audit --omit=dev || true
  allow_failure: true
  only:
    - develop
    - main

security:trivy:
  stage: test-security
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --no-progress .
  allow_failure: true
  only:
    - develop
    - main

# ============================================
# DOCKER BUILD (FIXED 🔥)
# ============================================

docker:build:
  stage: docker-build
  tags: [kubernetes]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - echo "🐳 Build image..."

    - mkdir -p /kaniko/.docker

    # 🔥 FIX QUOTING
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')

    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "auth": "$AUTH"
          }
        }
      }
      EOF

    - /kaniko/executor \
        --context "${CI_PROJECT_DIR}/server" \
        --dockerfile "${CI_PROJECT_DIR}/server/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:latest"

  only:
    - main
    - /^release\/.*$/

# ============================================
# DEPLOY
# ============================================

deploy:staging:
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: [""]
  script:
    - apk add --no-cache curl
    - curl -X POST $STAGING_DEPLOY_HOOK || true
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: [""]
  script:
    - apk add --no-cache curl
    - curl -X POST $PRODUCTION_DEPLOY_HOOK || true
  only:
    - main
  when: manual