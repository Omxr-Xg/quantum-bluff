# Définition de l'image Docker (JDK 17 est standard pour JavaFX moderne)
image: maven:3.8.5-openjdk-17

# Définition des étapes du pipeline
stages:
  - build
  - test
  - package

# 1. Étape de compilation
build_job:
  stage: build
  script:
    - mvn clean compile
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# 2. Étape des tests (crucial pour valider les calculs de probabilités)
test_job:
  stage: test
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml

# 3. Étape de création de l'exécutable (Client Lourd)
package_job:
  stage: package
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    name: "QuantumBluff_Executable"
    expire_in: 1 week

# Optionnel : Vérification du style de code (Qualité)
linting_job:
  stage: test
  script:
    - mvn checkstyle:check
  allow_failure: true