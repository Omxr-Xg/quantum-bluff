# ============================================
# .gitlab-ci.yml - Quantum Bluff
# Configuration CI/CD professionnelle
# ============================================

# Explicitly disable Auto DevOps
variables:
  AUTO_DEVOPS: "off"  # ← THIS IS CRITICAL
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  NODE_OPTIONS: "--max-old-space-size=4096"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  # Prevent any Auto DevOps template inclusion

include: []  # ← This ensures no implicit includes

# Cache pour accélérer les pipelines
cache:
  paths:
    - .m2/repository/
    - node_modules/
    - frontend/node_modules/
    - backend/target/

# Stages
stages:
  - lint
  - test
  - test-security
  - build
  - analyze
  - deploy-staging
  - deploy-prod

# ============================================
# BACKEND - NODE.JS/TYPESCRIPT
# ============================================

backend:lint:
  stage: lint
  image: node:18
  script:
    - cd server
    - echo "🔍 Vérification du style de code backend..."
    - npm install
    - npm run lint  # ou npx eslint . --ext .ts
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/
  artifacts:
    reports:
      codequality: server/lint-results.xml
    expire_in: 1 week
  allow_failure: true  # Temporaire si la commande lint n'existe pas encore

backend:test:
  stage: test
  image: node:20  # ← Changement de node:18 à node:20
  services:
    - postgres:15
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - echo "🧪 Lancement des tests backend..."
    - npm install
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: server/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: server/coverage/cobertura-coverage.xml
    paths:
      - server/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:build:
  stage: build
  image: node:18
  script:
    - cd server
    - echo "📦 Build backend..."
    - npm install
    - npm run build  # si tu as un script build qui compile TypeScript
  artifacts:
    paths:
      - server/dist/  # si tu compiles vers dist/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/
    
# ============================================
# FRONTEND - REACT/NODE
# ============================================

frontend:lint:
  stage: lint
  image: node:18
  script:
    - cd client
    - echo "🔍 Vérification du style frontend..."
    - npm install
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

frontend:test:
  stage: test
  image: node:18
  script:
    - cd frontend
    - echo "🧪 Lancement des tests frontend..."
    - npm install
    - npm test -- --coverage --watchAll=false
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

frontend:build:
  stage: build
  image: node:18
  script:
    - cd frontend
    - echo "📦 Build frontend..."
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# SÉCURITÉ - LINDA & MASSI
# ============================================

security:scan-deps:
  stage: test-security
  image: node:18
  script:
    - echo "🔐 Scan des dépendances frontend..."
    - cd frontend
    - npm audit --production || true
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/
  artifacts:
    reports:
      dependency_scanning: frontend/npm-audit.json
    expire_in: 1 week

security:scan-docker:
  stage: test-security
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "🔐 Scan des images Docker..."
    - docker build -t quantum-bluff:latest .
    - docker scan quantum-bluff:latest || true
  allow_failure: true
  only:
    - main
    - /^release\/.*$/
  dependencies: []

security:trivy-scan:
  stage: test-security
  image: aquasec/trivy:latest
  script:
    - echo "🔐 Scan Trivy complet..."
    - trivy fs --severity HIGH,CRITICAL --no-progress --exit-code 0 .
  allow_failure: true
  only:
    - main
    - develop

# ============================================
# ANALYSE DE CODE - QUALITÉ
# ============================================

analyze:sonarqube:
  stage: analyze
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - echo "📊 Analyse SonarQube..."
    - sonar-scanner
      -Dsonar.projectKey=quantum-bluff
      -Dsonar.sources=.
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**
  only:
    - main
    - develop
  dependencies:
    - backend:test
    - frontend:test

# ============================================
# BUILD DOCKER IMAGE (optionnel)
# ============================================

build:docker:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "🐳 Construction de l'image Docker..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# DÉPLOIEMENTS
# ============================================

deploy:staging:
  stage: deploy-staging
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur l'environnement STAGING..."
    - apk add --no-cache curl
    - curl -X POST $STAGING_DEPLOY_HOOK
  environment:
    name: staging
    url: https://staging.quantum-bluff.fr
  only:
    - develop
  dependencies:
    - backend:build
    - frontend:build

deploy:production:
  stage: deploy-prod
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur PRODUCTION..."
    - apk add --no-cache curl
    - curl -X POST $PRODUCTION_DEPLOY_HOOK
  environment:
    name: production
    url: https://quantum-bluff.fr
  only:
    - main
  when: manual
  dependencies:
    - backend:build
    - frontend:build

# ============================================
# RAPPORTS DE COUVERTURE
# ============================================

coverage:
  stage: test
  image: alpine:latest
  script:
    - echo "✅ Tests et couverture terminés"
  dependencies: []
  only:
    - main
    - develop