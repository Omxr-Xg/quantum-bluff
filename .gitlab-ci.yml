variables:
  NODE_IMAGE: public.ecr.aws/docker/library/node:20
  POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.58.1
  # Sans ça, le cache GitLab sur `.npm/` reste vide : chaque job retélécharge les paquets.
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm"

.node_docker_ci:
  image:
    name: public.ecr.aws/docker/library/node:20

default:
  tags:
    - kubernetes
  # Le runner K8s peut échouer avant tout script (nœuds indisponibles, disk-pressure, timeout de pod).
  # Relance uniquement dans ces cas, pas sur une vraie erreur de test ou de lint.
  retry:
    max: 4
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Évite 3 pods verify en parallèle (backend + frontend + database) sur un cluster déjà saturé.
.verify_kubernetes_throttled:
  resource_group: k8s-verify-${CI_PROJECT_ID}

stages:
  - verify
  - test-security
  - build
  - docker-build
  - deploy

cache:
  key:
    files:
      - server/package-lock.json
      - client/package-lock.json
  paths:
    - .npm/

# --- develop / main : un seul npm ci + lint + tests (au lieu de 2 jobs séquentiels)
backend:verify:
  extends:
    - .node_docker_ci
    - .verify_kubernetes_throttled
  stage: verify
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    NODE_ENV: test
    JWT_SECRET: "ci-secret-32chars-minimum-123456"
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run lint
    - npm run test:coverage
  only:
    - develop
    - main

frontend:verify:
  extends:
    - .node_docker_ci
    - .verify_kubernetes_throttled
  stage: verify
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run lint
    - npm test
  only:
    - develop
    - main

# Branches feature/fix : lint backend seul (pas de BDD / tests unitaires serveur)
backend:lint:
  stage: verify
  image: public.ecr.aws/docker/library/node:20
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - /^feature\/.*$/
    - /^fix\/.*$/

database:test:
  extends: .verify_kubernetes_throttled
  stage: verify
  image:
    name: public.ecr.aws/docker/library/postgres:15
    entrypoint: [""]
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - psql -h postgres -U test_user -d quantum_test -c "SELECT 1;"
  only:
    - develop
    - main

backend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd server
    - npm ci
    - npx prisma generate
    - npm run build
  only:
    - main
    - /^release\/.*$/

frontend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run build
  only:
    - main
    - /^release\/.*$/

# Pas de npm ci : audit à partir des lockfiles uniquement (beaucoup plus rapide).
security:npm:
  extends: .node_docker_ci
  stage: test-security
  script:
    - cd server && npm audit --omit=dev --package-lock-only --audit-level=high
    - cd ../client && npm audit --omit=dev --package-lock-only --audit-level=high
  allow_failure: true
  only:
    - develop
    - main

security:trivy:
  stage: test-security
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.58.1
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --no-progress --skip-dirs node_modules --skip-dirs dist --skip-dirs android --skip-dirs ios .
  allow_failure: true
  only:
    - develop
    - main

docker:build:
  stage: docker-build
  needs:
    # optional : branches release/* n’exécutent pas verify (historique du projet).
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - echo "Build image..."
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/server"
        --dockerfile "${CI_PROJECT_DIR}/server/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:latest"
  only:
    - develop
    - main
    - /^release\/.*$/

# Images pour déploiement VM sans « docker compose build » (pull uniquement).
docker:build:client:
  stage: docker-build
  needs:
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # Surchargeable dans GitLab → Settings → CI/CD → Variables (ex. préfixe API derrière nginx).
    VITE_API_URL: "/vmProjetIntegrateurgrp10-0"
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/client"
        --dockerfile "${CI_PROJECT_DIR}/client/Dockerfile"
        --build-arg "VITE_API_URL=${VITE_API_URL}"
        --destination "${CI_REGISTRY_IMAGE}:client-${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:client-latest"
  only:
    - develop
    - main
    - /^release\/.*$/

docker:build:ai-service:
  stage: docker-build
  needs:
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "${CI_PROJECT_DIR}/server/ai-service"
        --dockerfile "${CI_PROJECT_DIR}/server/ai-service/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:ai-${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:ai-latest"
  only:
    - develop
    - main
    - /^release\/.*$/

# Déploiement = POST webhook. Les échecs "runner_system_failure" viennent souvent du cluster K8s
# du runner (disque plein, nœud unreachable). On retente automatiquement ; si ça persiste,
# contacter les admins GitLab / infra Unistra — ce n’est pas corrigeable uniquement dans ce fichier.
.deploy_hook_retry: &deploy_hook_retry
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

deploy:staging:
  <<: *deploy_hook_retry
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: [""]
  before_script:
    - echo " Préparation de la connexion SSH..."
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo " Création du fichier .env sécurisé..."
    - echo "JWT_SECRET=$JWT_SECRET" > .env.prod
    - echo "DATABASE_URL=$DATABASE_URL" >> .env.prod
    
    - echo " Envoi du fichier .env sur la VM..."
    - scp .env.prod $VM_USER@$VM_IP:~/quantum-bluff/.env
    
    - echo " Déploiement automatique sur la VM (Staging)..."
    - ssh $VM_USER@$VM_IP "cd ~/quantum-bluff && git pull && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml pull && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml up -d --force-recreate && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml exec -T backend npx prisma migrate deploy"
  only:
    - develop
  when: manual

deploy:production:
  <<: *deploy_hook_retry
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: [""]
  before_script:
    - echo " Préparation de la connexion SSH..."
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo " Création du fichier .env sécurisé..."
    - echo "JWT_SECRET=$JWT_SECRET" > .env.prod
    - echo "DATABASE_URL=$DATABASE_URL" >> .env.prod
    
    - echo " Envoi du fichier .env sur la VM..."
    - scp .env.prod $VM_USER@$VM_IP:~/quantum-bluff/.env
    
    - echo " Déploiement sur la VM (Production)..."
    - ssh $VM_USER@$VM_IP "cd ~/quantum-bluff && git pull && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml pull && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml up -d --force-recreate && docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml exec -T backend npx prisma migrate deploy"
  only:
    - main
  when: manual