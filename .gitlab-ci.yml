# ============================================
# .gitlab-ci.yml - Quantum Bluff
# Configuration complète : Frontend, Backend, DB, Sécurité, Infrastructure
# ============================================

# Image par défaut
default:
  image: node:20

# Définition des stages
stages:
  - lint
  - test
  - test-security
  - build
  - docker-build
  - deploy

# ============================================
# CACHE PARTAGÉ
# ============================================
cache:
  paths:
    - server/node_modules/
    - client/node_modules/
    - .npm/

# ============================================
# BACKEND - Node.js / TypeScript
# ============================================

backend:lint:
  stage: lint
  script:
    - cd server
    - npm ci
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:test:
  stage: test
  services:
    - postgres:15
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: server/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: server/coverage/cobertura-coverage.xml
    paths:
      - server/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/

backend:build:
  stage: build
  script:
    - cd server
    - npm ci
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - server/dist/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# FRONTEND - React / Vite / TypeScript
# ============================================

frontend:lint:
  stage: lint
  script:
    - cd client
    - npm ci
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/

frontend:test:
  stage: test
  script:
    - cd client
    - npm ci
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: client/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    paths:
      - client/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/

frontend:build:
  stage: build
  script:
    - cd client
    - npm ci
    - npm run build
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# BASE DE DONNÉES - Tests et validation
# ============================================

database:test:
  stage: test
  image: postgres:15
  services:
    - postgres:15
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - echo "🧪 Vérification de la base de données..."
    - psql -h postgres -U test_user -d quantum_test -c "SELECT 1;" || exit 1
    - echo "✅ Connexion DB OK"
  only:
    - develop
    - main
    - /^feature\/.*$/

database:migrations:
  stage: build
  image: postgres:15
  services:
    - postgres:15
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - echo "📦 Vérification des migrations..."
    - if [ -f database/init.sql ]; then
        psql -h postgres -U test_user -d quantum_test -f database/init.sql;
      fi
    - echo "✅ Migrations appliquées"
  only:
    - develop
    - main

# ============================================
# SÉCURITÉ - Scans et analyses (Linda & Massi)
# ============================================

security:scan-deps-backend:
  stage: test-security
  script:
    - cd server
    - npm ci
    - npm audit --production
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/

security:scan-deps-frontend:
  stage: test-security
  script:
    - cd client
    - npm ci
    - npm audit --production
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/

security:trivy-scan:
  stage: test-security
  image: aquasec/trivy:latest
  script:
    - echo "🔐 Scan Trivy du code source..."
    - trivy fs --severity HIGH,CRITICAL --no-progress --exit-code 0 .
  allow_failure: true
  only:
    - main
    - develop

security:secret-detection:
  stage: test-security
  image: node:20
  script:
    - echo "🔍 Recherche de secrets exposés..."
    - npx trufflehog --no-update file://. || true
  allow_failure: true
  only:
    - main
    - develop

security:sast:
  stage: test-security
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config auto --error .
  allow_failure: true
  only:
    - main
    - develop

# ============================================
# DOCKER - Construction et scan des images
# ============================================

docker:build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  script:
    - echo "🐳 Construction de l'image Docker..."
    - docker build -t $IMAGE_TAG .
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - /^release\/.*$/

docker:scan:
  stage: test-security
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "🔐 Scan de l'image Docker..."
    - docker build -t quantum-bluff:test .
    - docker scan quantum-bluff:test || echo "⚠️ Docker scan non disponible"
  allow_failure: true
  only:
    - main
    - /^release\/.*$/

# ============================================
# INFRASTRUCTURE - Validation des configs (Nginx, Docker Compose)
# ============================================

infra:nginx-config:
  stage: test
  image: nginx:alpine
  script:
    - echo "🔧 Validation de la configuration Nginx..."
    - nginx -t
  only:
    - develop
    - main

infra:docker-compose:
  stage: test
  image: docker/compose:latest
  script:
    - echo "🔧 Validation du docker-compose..."
    - docker-compose -f database/docker-compose.yml config
  only:
    - develop
    - main

# ============================================
# DOCUMENTATION - Vérification (optionnel)
# ============================================

docs:markdown-lint:
  stage: lint
  image: node:20
  script:
    - npm install -g markdownlint-cli
    - markdownlint 'Docs/**/*.md' || echo "⚠️ Documentation non vérifiée"
  allow_failure: true
  only:
    - develop
    - main

# ============================================
# DÉPLOIEMENT - Staging et Production
# ============================================

deploy:staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur STAGING..."
    - apk add --no-cache curl
    - curl -X POST $STAGING_DEPLOY_HOOK || echo "⚠️ Webhook non configuré"
  environment:
    name: staging
    url: https://staging.quantum-bluff.fr
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Déploiement sur PRODUCTION..."
    - apk add --no-cache curl
    - curl -X POST $PRODUCTION_DEPLOY_HOOK || echo "⚠️ Webhook non configuré"
  environment:
    name: production
    url: https://quantum-bluff.fr
  only:
    - main
  when: manual

# ============================================
# RAPPORTS DE COUVERTURE
# ============================================

coverage:
  stage: test
  script:
    - echo "📊 Génération des rapports de couverture"
  dependencies:
    - backend:test
    - frontend:test
  only:
    - main
    - develop