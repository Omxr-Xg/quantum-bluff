variables:
  # Sur runners K8s partagés : docker.io (anonyme) et public.ecr.aws peuvent renvoyer TOOMANYREQUESTS.
  # `mirror.gcr.io/library/*` = miroir Google des Docker Official Images (node, postgres, nginx…).
  NODE_IMAGE: mirror.gcr.io/library/node:20
  POSTGRES_IMAGE: mirror.gcr.io/library/postgres:15
  # Trivy : rester sur ECR Public (image hors library/) ; si rate limit, passer en allow_failure ou image interne.
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.58.1
  REDIS_IMAGE: mirror.gcr.io/library/redis:7-alpine
  # Sans ça, le cache GitLab sur `.npm/` reste vide : chaque job retélécharge les paquets.
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm"

.node_docker_ci:
  image:
    name: $NODE_IMAGE

default:
  tags:
    - kubernetes
  # Le runner K8s peut échouer avant tout script (nœuds indisponibles, disk-pressure, timeout de pod).
  # Relance uniquement dans ces cas, pas sur une vraie erreur de test ou de lint.
  # Important : `max` doit être un entier 0–2 (GitLab refuse / ignore au-delà). Une ligne `max:` vide
  # casse la config et peut laisser les jobs en « waiting » sans démarrer correctement.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Les jobs verify tournent en parallèle (durée ~ max des trois, pas la somme).
# Si le cluster K8s du runner sature (OOM, pods Pending), réintroduire par ex. :
#   resource_group: k8s-verify-${CI_PROJECT_ID}
# sur les jobs lourds uniquement.

stages:
  - verify
  - test-security
  - build
  - docker-build

cache:
  key:
    files:
      - server/package-lock.json
      - client/package-lock.json
  paths:
    - .npm/

# --- develop / main : un seul npm ci + lint + tests (au lieu de 2 jobs séquentiels)
backend:verify:
  extends:
    - .node_docker_ci
  stage: verify
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    NODE_ENV: test
    JWT_SECRET: "ci-secret-32chars-minimum-123456"
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run lint
    - npm run test:coverage
  only:
    - develop
    - main

frontend:verify:
  extends:
    - .node_docker_ci
  stage: verify
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run lint
    - npm test
  only:
    - develop
    - main

# Stress test Socket.IO : serveur réel + N connexions authentifiées (charge réduite en CI).
backend:load-test:
  extends:
    - .node_docker_ci
  stage: verify
  needs:
    - backend:verify
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
    - name: $REDIS_IMAGE
      alias: redis
  variables:
    NODE_ENV: development
    JWT_SECRET: "ci-secret-32chars-minimum-123456"
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # Runners K8s : 200 connexions (local : 2000 via défaut du script).
    LOAD_TEST_CLIENTS: "200"
    LOAD_TEST_INTERVAL_MS: "10"
    LOAD_TEST_CONNECT_TIMEOUT_MS: "20000"
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run load-test:ci
  only:
    - develop
    - main

# Branches feature/fix : lint backend seul (pas de BDD / tests unitaires serveur)
backend:lint:
  stage: verify
  image: $NODE_IMAGE
  script:
    - cd server
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - /^feature\/.*$/
    - /^fix\/.*$/

database:test:
  stage: verify
  image:
    name: $POSTGRES_IMAGE
    entrypoint: [""]
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - psql -h postgres -U test_user -d quantum_test -c "SELECT 1;"
  only:
    - develop
    - main

backend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd server
    - npm ci
    - npx prisma generate
    - npm run build
  only:
    - main
    - /^release\/.*$/

frontend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run build
  only:
    - main
    - /^release\/.*$/

# Pas de npm ci : audit à partir des lockfiles uniquement (beaucoup plus rapide).
security:npm:
  extends: .node_docker_ci
  stage: test-security
  script:
    - cd server && npm audit --omit=dev --package-lock-only --audit-level=high
    - cd ../client && npm audit --omit=dev --package-lock-only --audit-level=high
  allow_failure: true
  only:
    - develop
    - main

security:trivy:
  stage: test-security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --no-progress --skip-dirs node_modules --skip-dirs dist --skip-dirs android --skip-dirs ios .
  allow_failure: true
  only:
    - develop
    - main

docker:build:
  stage: docker-build
  needs:
    # optional : branches release/* n’exécutent pas verify (historique du projet).
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - echo "Build image..."
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --compressed-caching=false
        --context "${CI_PROJECT_DIR}/server"
        --dockerfile "${CI_PROJECT_DIR}/server/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:latest"
  only:
    - develop
    - main
    - /^release\/.*$/

# Image client Docker (registry GitLab).
docker:build:client:
  stage: docker-build
  needs:
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # Surchargeable dans GitLab → Settings → CI/CD → Variables (ex. préfixe API derrière nginx).
    VITE_API_URL: "https://api.quantum-bluff.com"
    # Réduit les pics RAM Kaniko (snapshot) sur runners K8s serrés.
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --compressed-caching=false
        --context "${CI_PROJECT_DIR}/client"
        --dockerfile "${CI_PROJECT_DIR}/client/Dockerfile"
        --build-arg "VITE_API_URL=${VITE_API_URL}"
        --destination "${CI_REGISTRY_IMAGE}:client-${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:client-latest"
  only:
    - develop
    - main
    - /^release\/.*$/

docker:build:ai-service:
  stage: docker-build
  needs:
    - job: backend:verify
      optional: true
    - job: frontend:verify
      optional: true
    - job: database:test
      optional: true
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --compressed-caching=false
        --context "${CI_PROJECT_DIR}/server/ai-service"
        --dockerfile "${CI_PROJECT_DIR}/server/ai-service/Dockerfile"
        --destination "${CI_REGISTRY_IMAGE}:ai-${CI_COMMIT_SHORT_SHA}"
        --destination "${CI_REGISTRY_IMAGE}:ai-latest"
  # Build de l'image AI uniquement sur les branches de release.
  # (Les runners K8s saturent souvent en disque sur ce job ; on évite de bloquer
  # les pipelines de develop/main tant que l'infra n'est pas élargie.)
  only:
    - /^release\/.*$/
