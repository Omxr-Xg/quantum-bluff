# ============================================
# .gitlab-ci.yml - Quantum Bluff
# Configuration complète : Frontend, Backend, DB, Sécurité, Infrastructure
# ============================================
#
# Ordre GitLab : les STAGES sont séquentiels (lint → test → test-security → build → …).
# Dans un même stage, les jobs partent en parallèle si des runners sont libres.
# Si tout s’enchaîne un par un, augmenter la concurrence côté runner (ex. concurrent),
# pas ici.
#
# Miroirs ECR public (images library Docker Hub) : évite le rate limit Docker Hub
# et les échecs de pull du Dependency Proxy GitLab (ex. backend:test, database:*).
variables:
  NODE_IMAGE: public.ecr.aws/docker/library/node:20
  POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15
  # Trivy via ECR public (évite Back-off / rate limit Docker Hub sur le runner Kubernetes).
  TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.58.1

# Image Node : entrypoint vidé pour le détecteur de shell du runner Docker (#28129).
# Utiliser extends (et pas seulement default.image) : le merge vers le runner est fiable.
.node_docker_ci:
  image:
    name: public.ecr.aws/docker/library/node:20
    entrypoint:
      - ""

default:
  # git.unistra.fr : sans tag = pending. services: (Postgres) → job tag kubernetes.
  tags:
    - node18

# Définition des stages
stages:
  - lint
  - test
  - test-security
  - build
  - docker-build
  - deploy

# ============================================
# CACHE PARTAGÉ
# ============================================
# Ne PAS mettre server/client node_modules en cache : volumes Docker énormes et
# échecs « no space left on device » sur les runners partagés (git.unistra.fr).
# Seul le cache npm (tarballs) est conservé — npm ci reste correct.
cache:
  key:
    files:
      - server/package-lock.json
      - client/package-lock.json
  paths:
    - .npm/

# ============================================
# BACKEND - Node.js / TypeScript
# ============================================

backend:lint:
  extends: .node_docker_ci
  stage: lint
  variables:
    # Évite les échecs ESLint / TypeScript sur runners peu de RAM
    NODE_OPTIONS: --max-old-space-size=4096
  script:
    - cd server
    - rm -rf node_modules
    - npm ci
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:test:
  extends: .node_docker_ci
  stage: test
  # Services Docker (PostgreSQL) : préférer le runner cluster Kubernetes.
  tags:
    - kubernetes
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    NODE_ENV: test
    # Pas de .env en CI : env.ts exige JWT_SECRET (≥32) et DATABASE_URL au chargement des modules.
    JWT_SECRET: "quantum-bluff-ci-jest-secret-32chars-min!!"
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/quantum_test
  script:
    - cd server
    - npm ci
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: server/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: server/coverage/cobertura-coverage.xml
    paths:
      - server/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

backend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd server
    - npm ci
    - npx prisma generate
    - npm run build
  artifacts:
    paths:
      - server/dist/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# FRONTEND - React / Vite / TypeScript
# ============================================

frontend:lint:
  extends: .node_docker_ci
  stage: lint
  variables:
    NODE_OPTIONS: --max-old-space-size=4096
  script:
    - cd client
    - rm -rf node_modules
    - npm ci --legacy-peer-deps
    - npm run lint
  only:
    - develop
    - main
    - /^feature\/.*$/

frontend:test:
  extends: .node_docker_ci
  stage: test
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: client/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    paths:
      - client/coverage/
    expire_in: 1 week
  only:
    - develop
    - main
    - /^feature\/.*$/

frontend:build:
  extends: .node_docker_ci
  stage: build
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - client/dist/
    expire_in: 1 month
  only:
    - develop
    - main
    - /^release\/.*$/

# ============================================
# BASE DE DONNÉES - Tests et validation
# ============================================

database:test:
  stage: test
  tags:
    - kubernetes
  image:
    name: public.ecr.aws/docker/library/postgres:15
    entrypoint: ['']
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - echo "🧪 Vérification de la base de données..."
    - psql -h postgres -U test_user -d quantum_test -c "SELECT 1;" || exit 1
    - echo "✅ Connexion DB OK"
  only:
    - develop
    - main
    - /^feature\/.*$/

database:migrations:
  stage: build
  tags:
    - kubernetes
  image:
    name: public.ecr.aws/docker/library/postgres:15
    entrypoint: ['']
  services:
    - name: public.ecr.aws/docker/library/postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: quantum_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
  script:
    - echo "📦 Vérification des migrations..."
    - if [ -f database/init.sql ]; then
        psql -h postgres -U test_user -d quantum_test -f database/init.sql;
      fi
    - echo "✅ Migrations appliquées"
  only:
    - develop
    - main

# ============================================
# SÉCURITÉ - Scans et analyses (Linda & Massi)
# ============================================

security:scan-deps-backend:
  extends: .node_docker_ci
  stage: test-security
  script:
    - cd server
    - npm ci
    - npm audit --omit=dev
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/

security:scan-deps-frontend:
  extends: .node_docker_ci
  stage: test-security
  script:
    - cd client
    - npm ci --legacy-peer-deps
    - npm audit --omit=dev
  allow_failure: true
  only:
    - develop
    - main
    - /^feature\/.*$/

security:trivy-scan:
  stage: test-security
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.58.1
    entrypoint: ['']
  script:
    - echo "🔐 Scan Trivy du code source..."
    - trivy fs --severity HIGH,CRITICAL --no-progress --exit-code 0 .
  allow_failure: true
  only:
    - main
    - develop

security:secret-detection:
  extends: .node_docker_ci
  stage: test-security
  script:
    - echo "🔍 Recherche de secrets exposés..."
    - npx trufflehog --no-update file://. || true
  allow_failure: true
  only:
    - main
    - develop

security:sast:
  stage: test-security
  image:
    name: public.ecr.aws/docker/library/python:3.10-slim
    entrypoint: ['']
  dependencies: []
  before_script:
    - pip install semgrep
  script:
    - semgrep --config auto --error --exclude server/coverage --exclude client/coverage .
  allow_failure: true
  only:
    - main
    - develop

# ============================================
# DOCKER - Construction et scan des images
# ============================================
# Kaniko : build sans daemon Docker (compatible exécuteur Kubernetes sans privileged + docker:dind).
# Image backend : server/Dockerfile avec contexte server/ (pas de Dockerfile à la racine).

docker:build:
  stage: docker-build
  tags:
    - kubernetes
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  variables:
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  script:
    - echo "🐳 Construction et push de l'image (Kaniko)..."
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}/server" --dockerfile "${CI_PROJECT_DIR}/server/Dockerfile" --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" --destination "${CI_REGISTRY_IMAGE}:latest"
  only:
    - main
    - /^release\/.*$/

docker:scan:
  stage: test-security
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.58.1
    entrypoint: ['']
  script:
    - echo "🔐 Analyse statique du Dockerfile (Trivy)..."
    - trivy config --severity HIGH,CRITICAL --exit-code 0 server/Dockerfile
  allow_failure: true
  only:
    - main
    - /^release\/.*$/

# ============================================
# INFRASTRUCTURE - Validation des configs (Nginx, Docker Compose)
# ============================================

infra:nginx-config:
  stage: test
  image:
    name: public.ecr.aws/nginx/nginx:alpine
    entrypoint: ['']
  script:
    - echo "🔧 Validation de la configuration Nginx..."
    - nginx -t
  only:
    - develop
    - main

infra:docker-compose:
  stage: test
  # docker-compose config ne nécessite pas le daemon Docker (validation du fichier uniquement).
  image:
    name: docker/compose:1.29.2
    entrypoint: ['']
  script:
    - echo "🔧 Validation du docker-compose..."
    - docker-compose -f database/docker-compose.yml config
  only:
    - develop
    - main

# ============================================
# DOCUMENTATION - Vérification (optionnel)
# ============================================

docs:markdown-lint:
  extends: .node_docker_ci
  stage: lint
  script:
    - npm install -g markdownlint-cli
    # Utilise .markdownlint.json à la racine (règles assouplies pour la doc existante).
    - markdownlint 'Docs/**/*.md'
  only:
    - develop
    - main
    - /^feature\/.*$/
    - /^fix\/.*$/

# ============================================
# DÉPLOIEMENT - Staging et Production
# ============================================

# ============================================
# DÉPLOIEMENT - Staging et Production
# ============================================

deploy:staging:
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: ['']
  script:
    - echo "🚀 Déploiement sur STAGING..."
    - apk add --no-cache curl
    - curl -X POST $STAGING_DEPLOY_HOOK || echo "⚠️ Webhook non configuré"
  environment:
    name: staging
    url: https://staging.quantum-bluff.fr
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image:
    name: public.ecr.aws/docker/library/alpine:latest
    entrypoint: ['']
  script:
    - echo "🚀 Déploiement sur PRODUCTION..."
    - apk add --no-cache curl
    - curl -X POST $PRODUCTION_DEPLOY_HOOK || echo "⚠️ Webhook non configuré"
  environment:
    name: production
    url: https://quantum-bluff.fr
  only:
    - main
  when: manual

# ============================================
# RAPPORTS DE COUVERTURE
# ============================================

coverage:
  extends: .node_docker_ci
  stage: test
  # Attend explicitement les deux jobs de test (DAG) : évite une course aux artefacts
  # dans le même stage ; les autres jobs du stage test tournent en parallèle.
  needs:
    - backend:test
    - frontend:test
  script:
    - echo "📊 Génération des rapports de couverture"
  dependencies:
    - backend:test
    - frontend:test
  only:
    - main
    - develop