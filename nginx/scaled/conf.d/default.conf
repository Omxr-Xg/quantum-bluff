# Exemple : 3 services backend nommés (docker-compose avec backend1, backend2, backend3).
# Monter ce répertoire sur /etc/nginx/conf.d à la place de nginx/conf.d si vous n’utilisez pas `docker compose --scale`.
map $http_upgrade $proxy_allowed_upgrade {
    default "";
    websocket $http_upgrade;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_upstreams {
    ip_hash;
    server backend1:3000;
    server backend2:3000;
    server backend3:3000;
}

server {
    listen 80;
    server_name _;

    location /vmProjetIntegrateurgrp10-0/api/ {
        proxy_pass http://backend_upstreams/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_upstreams/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://backend_upstreams/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $proxy_allowed_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /vmProjetIntegrateurgrp10-0/socket.io {
        proxy_pass http://backend_upstreams/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $proxy_allowed_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
