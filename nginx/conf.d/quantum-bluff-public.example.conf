# Exemple pour https://quantum-bluff.com + https://api.quantum-bluff.com
# Copier vers conf.d/ sur le serveur et adapter les chemins certbot.
#
# Si le navigateur affiche « CORS » avec status 502 : l’API ne répond pas (backend down).
# Vérifier : docker compose ps backend && curl -sS https://api.quantum-bluff.com/api/health/live

map $http_upgrade $proxy_allowed_upgrade {
    default "";
    websocket $http_upgrade;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $cors_allow_origin {
    default "";
    "~^https://(www\.)?quantum-bluff\.com$" $http_origin;
}

upstream backend_upstreams {
    ip_hash;
    server backend:3000;
}

server {
    listen 80;
    server_name api.quantum-bluff.com;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-request-id, x-idempotency-key" always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://backend_upstreams;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Vary Origin always;
    }
}

server {
    listen 80;
    server_name quantum-bluff.com www.quantum-bluff.com;

    location /socket.io {
        proxy_pass http://backend_upstreams/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $proxy_allowed_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend_upstreams/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
