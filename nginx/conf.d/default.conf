server {
    listen 80;
    server_name _;

    # 1. Reverse proxy pour l'API du Backend
    location /vmProjetIntegrateurgrp10-0/api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Reverse proxy pour les WebSockets (Socket.IO)
    location /vmProjetIntegrateurgrp10-0/socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Reverse proxy pour le Frontend
    location /vmProjetIntegrateurgrp10-0/ {
        proxy_pass http://frontend:80/; # Si le frontend crashe, remplace 80 par 5173
        proxy_set_header Host $host;
    }
}