server {
    listen 80;
    server_name quantum-bluff.fr www.quantum-bluff.fr; # Remplacer par votre domaine ou IP VM

    # Utilisé par Certbot pour valider la propriété du domaine (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # En attendant d'avoir généré le certificat SSL, on sert l'appli en HTTP
    # Une fois SSL configuré, on décommentera la ligne de redirection 301 en bas et on supprimera ce bloc
    location / {
        proxy_pass http://frontend:80; # Suppose que le frontend Dockerfile utilise nginx
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /vmProjetIntegrateurgrp10-0/api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /vmProjetIntegrateurgrp10-0/socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # REDIRECTION HTTPS (A décommenter après l'étape Certbot)
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

