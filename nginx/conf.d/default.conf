# WebSocket : ne pas forcer Upgrade/Connection en dur (mitigation H2C smuggling — Semgrep)
# Voir https://nginx.org/en/docs/http/websocket.html
map $http_upgrade $connection_upgrade {
    default "";
    websocket upgrade;
}

server {
    listen 80;
    server_name _;

    # 1. Reverse proxy pour l'API du Backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Reverse proxy pour les WebSockets (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Reverse proxy pour le Frontend
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }

    # 4. Reverse proxy spécifique VM pour les WebSockets
    location /vmProjetIntegrateurgrp10-0/socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    # REDIRECTION HTTPS (A décommenter après l'étape Certbot)
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

