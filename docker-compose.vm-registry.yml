# Déploiement VM sans build local : tirer les images depuis le Container Registry GitLab.
#
# Prérequis sur la VM :
#   1. Créer un fichier .env à la racine du repo (ou exporter dans le shell) :
#        QUANTUM_REGISTRY_IMAGE=registry.gitlab.com/VOTRE_GROUPE/VOTRE_PROJET
#      (même valeur que CI_REGISTRY_IMAGE dans GitLab → Infrastructure → Container Registry)
#   2. Se connecter au registry :
#        docker login registry.gitlab.com
#      (token « read_registry » ou mot de passe + utilisateur GitLab)
#
# Déployer / mettre à jour :
#   docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml pull
#   docker compose -f docker-compose.prod.yml -f docker-compose.vm-registry.yml up -d
#
# Les tags poussés par la CI (develop / main / release/*) :
#   - backend  : :latest et :<commit-short-sha>
#   - frontend : :client-latest et :client-<sha>
#   - ai-service : :ai-latest et :ai-<sha>
#
# Si « build: null » n’est pas accepté par votre version de Compose, supprimez manuellement
# les blocs « build: » de backend / frontend / ai-service dans une copie locale de prod.
#
services:
  backend:
    image: ${QUANTUM_REGISTRY_IMAGE:?Définir QUANTUM_REGISTRY_IMAGE dans .env}:latest
    pull_policy: always
    build: null

  frontend:
    image: ${QUANTUM_REGISTRY_IMAGE}:client-latest
    pull_policy: always
    build: null

  ai-service:
    image: ${QUANTUM_REGISTRY_IMAGE}:ai-latest
    pull_policy: always
    build: null
